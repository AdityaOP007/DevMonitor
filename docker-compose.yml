services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: devmonitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devmonitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-devmonitor}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 2. Express Backend API & Metrics Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devmonitor-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-devmonitor}
      CORS_ORIGIN: http://localhost:8080
      ENABLE_TEST_ENDPOINTS: ${ENABLE_TEST_ENDPOINTS:-true}
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-15}
      HEALTH_CHECK_INTERVAL_SECONDS: ${HEALTH_CHECK_INTERVAL_SECONDS:-30}
      TEST_MAX_REQUESTS: ${TEST_MAX_REQUESTS:-1000}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-5000}
      # Monitored service probe URLs using Docker Compose internal network service names
      BACKEND_HEALTH_URL: http://backend:5000/api/health
      FRONTEND_URL: http://frontend:80
      PROMETHEUS_URL: http://prometheus:9090/-/healthy
      GRAFANA_URL: http://grafana:3000/api/health
    ports:
      # Published strictly to loopback (127.0.0.1) for host curl and Prometheus scrapes.
      # /metrics is unauthenticated and must NEVER be exposed publicly on all network interfaces.
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/metrics').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 3. React Frontend SPA served via Nginx reverse proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_MOCK: "false"
    container_name: devmonitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # Web user interface accessible in the host browser at http://localhost:8080
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 4. Prometheus Metrics Collection & Storage Service
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: devmonitor-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      # Published on LOOPBACK ONLY. Prometheus has no authentication
      # and must NEVER be exposed publicly on external/LAN network interfaces.
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 5. Node Exporter Hardware & OS Telemetry Service
  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: devmonitor-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      # Host root mounted read-only.
      # Note: rslave is rejected on Docker Desktop (WSL2/Windows) with
      # "path / is not a shared or slave mount", so we fall back to /:/host:ro.
      - /:/host:ro
    # Node Exporter is intentionally NOT published to the host (no ports).
    # It is reachable only internally by Prometheus on the devmonitor network at node-exporter:9100.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9100/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 6. Grafana Visualization & Dashboarding Service
  grafana:
    image: grafana/grafana-oss:11.5.2
    container_name: devmonitor-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/devmonitor-application.json
    ports:
      # Published strictly to loopback (127.0.0.1) for local host access.
      # Grafana must NEVER be published publicly without HTTPS and proper authentication.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 7. Local Alert Webhook Receiver Service
  alert-receiver:
    build:
      context: ./alert-receiver
      dockerfile: Dockerfile
    container_name: devmonitor-alert-receiver
    restart: unless-stopped
    ports:
      # Published on LOOPBACK ONLY (127.0.0.1).
      # The receiver has no authentication; never publish publicly on external interfaces.
      - "127.0.0.1:8025:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

  # 8. Alertmanager Alert Routing & Notification Service
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: devmonitor-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://127.0.0.1:9093
      - --cluster.listen-address=
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/${ALERTMANAGER_CONFIG:-alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    ports:
      # Published strictly to loopback (127.0.0.1) for local host access.
      # Alertmanager has no authentication and must NEVER be published publicly.
      - "127.0.0.1:9093:9093"
    depends_on:
      alert-receiver:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - devmonitor

volumes:
  postgres_data:
    name: devmonitor_postgres_data
  prometheus_data:
    name: devmonitor_prometheus_data
  grafana_data:
    name: devmonitor_grafana_data
  alertmanager_data:
    name: devmonitor_alertmanager_data

networks:
  devmonitor:
    name: devmonitor

