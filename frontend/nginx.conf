server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Embedded Docker DNS resolver for dynamic per-request upstream resolution
    # Prevents Nginx crash on startup or reload when backend container is stopped
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API Reverse Proxy to backend container
    location /api/ {
        set $backend_upstream "http://backend:5000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Alert Receiver Reverse Proxy
    # Proxies ONLY GET (and HEAD) requests to the alert receiver container on the Docker network.
    # Uses the Docker resolver variable technique so Nginx starts and stays up even if the receiver is down.
    location = /receiver/alerts {
        limit_except GET HEAD {
            deny all;
        }
        set $receiver_upstream "http://alert-receiver:8080/alerts";
        proxy_pass $receiver_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Block all other receiver endpoints (/clear, /webhook, /health, /) from external access
    location /receiver/ {
        return 404;
    }

    # Internal metrics are not exposed through the frontend reverse proxy
    location = /metrics {
        return 404;
    }

    location /metrics/ {
        return 404;
    }

    # Cache hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Never cache entrypoint index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA Fallback: route client paths to index.html for react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
